# Omarchy Jetson automatic updates.
#
# enabled=yes installs pending updates by themselves once the daily check has
# found them and the board is idle and online. enabled=no (the default) only
# checks and downloads; install with omarchy-update.
#
# Kernel and Jetson BSP updates (linux-jetson*, nvidia-jetson-*) never install
# automatically, and the board never reboots by itself.
#
# Change with: omarchy-jetson-update-settings --auto on|off
# The daily time: omarchy-jetson-update-settings --time HH:MM
enabled=no
