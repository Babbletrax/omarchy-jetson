TIMEOUT 50
DEFAULT original

MENU TITLE Omarchy Jetson Arch boot options

LABEL diagnostic
      MENU LABEL diagnostic boot (visible kernel and systemd logs)
      LINUX /boot/Image
      INITRD /boot/initrd
      APPEND ${cbootargs} root=PARTUUID=8e77e68e-2a2a-4816-b976-74088eabff66 rw rootwait rootfstype=ext4 init=/sbin/init-debug console=ttyTCU0,115200 console=ttyAMA0,115200 console=tty0 firmware_class.path=/etc/firmware ignore_loglevel loglevel=8 systemd.log_target=journal-or-kmsg systemd.log_level=debug efi_pstore.pstore_disable=1 pstore.backend=ramoops efi=runtime nvme.use_threaded_interrupts=1 swiotlb=2048 pci=pcie_bus_perf

LABEL original
      MENU LABEL original flashed boot arguments
      LINUX /boot/Image
      INITRD /boot/initrd
      APPEND ${cbootargs} root=PARTUUID=8e77e68e-2a2a-4816-b976-74088eabff66 rw rootwait rootfstype=ext4 mminit_loglevel=4 console=ttyTCU0,115200 console=ttyAMA0,115200 firmware_class.path=/etc/firmware fbcon=map:0 video=efifb:off console=tty0 efi_pstore.pstore_disable=1 pstore.backend=ramoops efi=runtime nvme.use_threaded_interrupts=1 swiotlb=2048 pci=pcie_bus_perf
