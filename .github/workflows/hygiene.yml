name: public hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: public-hygiene.sh
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for private names, addresses and blobs
        env:
          # Maintainer-specific patterns, one ERE per line. Secrets are not
          # given to pull requests from forks: there the public rules still
          # run and the job passes or fails on those alone.
          HYGIENE_PRIVATE_PATTERNS: ${{ secrets.HYGIENE_PRIVATE_PATTERNS }}
        run: |
          if [[ -z $HYGIENE_PRIVATE_PATTERNS ]]; then
            echo "::notice::HYGIENE_PRIVATE_PATTERNS is not available (fork pull request?); public rules only."
            echo 'Private hygiene patterns unavailable: public rules only.' >>"$GITHUB_STEP_SUMMARY"
          fi
          ./tests/public-hygiene.sh

      - name: Scan for hard-coded machine, network and personal configuration
        run: ./tests/no-hardcoded-config.py
