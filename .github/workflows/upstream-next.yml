name: upstream next

# The regression suites against the newest Omarchy release in the Omarchy
# repository, so an upstream change that will break the next pin shows up
# before the bump. Informational: a failure here does not block anything.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-check-latest:
    name: make check (latest Omarchy)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies and the latest Omarchy release
        uses: ./.github/actions/check-deps
        with:
          omarchy: latest

      - name: make check
        run: make check

  upstream-pins:
    name: pinned upstreams current
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pins with upstream releases
        run: python3 scripts/check-upstreams.py check
