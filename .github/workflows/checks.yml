name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588

jobs:
  make-check:
    name: make check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep python3 file xz-utils

      - name: Install ShellCheck (pinned release)
        run: |
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.aarch64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # tests/static.sh runs ShellCheck over the repository's shell scripts
      # whenever it is on PATH; the step above guarantees it is.
      - name: make check
        run: make check
