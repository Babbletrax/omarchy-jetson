name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  make-check:
    name: make check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies and the pinned Omarchy release
        uses: ./.github/actions/check-deps
        with:
          omarchy: pinned

      # Regression, static (including ShellCheck) and the public hygiene rules.
      # The maintainer-only hygiene patterns run in the public-hygiene workflow.
      - name: make check
        run: make check
